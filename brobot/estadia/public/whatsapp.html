<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b57">
  <meta name="robots" content="noindex">
  <title>WhatsApp simulado · Estadia BR</title>
  <style>
    :root { --bg: #efeae2; --top: #0b6b57; --in: #ffffff; --out: #d9fdd3; --ink: #111b21; --muted: #667781; --acc: #00a884; --line: #d1d7db; --tick: #53bdeb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b141a; --top: #1f2c34; --in: #202c33; --out: #005c4b; --ink: #e9edef; --muted: #8696a0; --line: #2a3942; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; display: flex; flex-direction: column; }
    header { background: var(--top); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; display: flex; gap: 12px; align-items: center; }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header small { display: block; opacity: .8; font-size: 12px; font-weight: 400; }
    header button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; padding: 0 6px 0 0; }
    .aviso { background: #fff3c4; color: #5c4400; font-size: 12.5px; padding: 8px 16px; }
    #lista { flex: 1; overflow-y: auto; background: var(--in); }
    .conv { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
    .ava { width: 46px; height: 46px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
    .conv b { display: block; }
    .conv span { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .vazio { padding: 30px 16px; color: var(--muted); text-align: center; }
    #chat { flex: 1; display: none; flex-direction: column; min-height: 0; }
    #msgs { flex: 1; overflow-y: auto; padding: 12px 12px 4px; display: flex; flex-direction: column; gap: 6px; }
    .b { max-width: 85%; padding: 7px 9px 4px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px .5px rgba(0,0,0,.13); line-height: 1.35; }
    .b.r { background: var(--in); align-self: flex-start; }
    .b.e { background: var(--out); align-self: flex-end; }
    .b .h { display: block; text-align: right; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .b a { color: #027eb5; }
    .rapidas { display: flex; gap: 8px; padding: 6px 12px; flex-wrap: wrap; }
    .rapidas button { border: 1px solid var(--acc); color: var(--acc); background: var(--in); border-radius: 18px; padding: 8px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
    form { display: flex; gap: 8px; padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); }
    form input { flex: 1; border: 0; border-radius: 22px; padding: 12px 16px; font-size: 16px; background: var(--in); color: var(--ink); min-width: 0; }
    form button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--acc); color: #fff; font-size: 18px; cursor: pointer; flex: none; }
    :focus-visible { outline: 2px solid var(--tick); outline-offset: 2px; }
  </style>
</head>
<body>
  <header><button id="voltar" hidden aria-label="Voltar">←</button><div><h1 id="titulo">WhatsApp</h1><small id="sub">Simulação do celular do destino e da transportadora</small></div></header>
  <div class="aviso">Demonstração: aqui você faz o papel da portaria ou da transportadora e responde às mensagens enviadas pelo Estadia BR.</div>
  <div id="lista"><p class="vazio">Carregando…</p></div>
  <div id="chat"><div id="msgs"></div>
    <div class="rapidas"><button data-r="SIM">SIM</button><button data-r="NÃO">NÃO</button><button data-r="OK">OK</button></div>
    <form id="f"><input id="txt" placeholder="Mensagem" autocomplete="off" aria-label="Mensagem"><button aria-label="Enviar">➤</button></form></div>
  <script>
  (function () {
    'use strict';
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (t) => esc(t).replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    const hora = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
    let atual = null, dados = [];

    async function carregar() {
      try {
        const r = await fetch('/api/sim/whatsapp');
        if (!r.ok) { $('#lista').innerHTML = '<p class="vazio">Simulador desativado neste ambiente.</p>'; return; }
        dados = (await r.json()).conversas;
      } catch { return; }
      if (atual) desenharChat(); else desenharLista();
    }
    function desenharLista() {
      $('#chat').style.display = 'none'; $('#lista').style.display = 'block'; $('#voltar').hidden = true;
      $('#titulo').textContent = 'WhatsApp'; $('#sub').textContent = 'Simulação do celular do destino e da transportadora';
      $('#lista').innerHTML = dados.length ? dados.map((c, i) => { const u = c.itens[c.itens.length - 1]; return `<div class="conv" data-i="${i}" tabindex="0"><span class="ava">${esc(c.nome[0] || '?')}</span><div style="min-width:0"><b>${esc(c.nome)} · ${c.papel === 'destino' ? 'Portaria / destino' : 'Transportadora'}</b><span>${esc((u.tipo === 'enviada' ? 'Você: ' : '') + u.texto)}</span></div></div>`; }).join('')
        : '<p class="vazio">Nenhuma mensagem ainda. Registre a chegada no app do motorista.</p>';
      document.querySelectorAll('.conv').forEach((el) => (el.onclick = el.onkeydown = (e) => { if (e.type === 'keydown' && e.key !== 'Enter') return; abrir(dados[el.dataset.i].telefone); }));
    }
    async function abrir(tel) { atual = tel; await fetch('/api/sim/whatsapp/abrir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ telefone: tel }) }); carregar(); }
    function desenharChat() {
      const c = dados.find((x) => x.telefone === atual);
      if (!c) { atual = null; return desenharLista(); }
      $('#lista').style.display = 'none'; $('#chat').style.display = 'flex'; $('#voltar').hidden = false;
      $('#titulo').textContent = `Estadia BR → ${c.nome}`; $('#sub').textContent = `Você está no celular de ${c.nome} (${c.telefoneFmt})`;
      const box = $('#msgs'); const fim = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      box.innerHTML = c.itens.map((i) => `<div class="b ${i.tipo === 'enviada' ? 'e' : 'r'}">${fmt(i.texto)}<span class="h">${hora(i.em)} ${i.tipo === 'enviada' ? '<span style="color:var(--tick)">✓✓</span>' : ''}</span></div>`).join('');
      if (fim) box.scrollTop = box.scrollHeight;
    }
    async function responder(texto) {
      if (!texto.trim() || !atual) return;
      $('#txt').value = '';
      await fetch('/api/sim/whatsapp/responder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ telefone: atual, texto }) });
      await carregar(); const box = $('#msgs'); box.scrollTop = box.scrollHeight;
    }
    $('#voltar').onclick = () => { atual = null; desenharLista(); };
    $('#f').onsubmit = (e) => { e.preventDefault(); responder($('#txt').value); };
    document.querySelectorAll('[data-r]').forEach((b) => (b.onclick = () => responder(b.dataset.r)));
    carregar(); setInterval(carregar, 3000);
  })();
  </script>
</body>
</html>
