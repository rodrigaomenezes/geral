name: Sinapse · testes

on:
  push:
    paths: ['brobot/sinapse/**', '.github/workflows/sinapse.yml']
  pull_request:
    paths: ['brobot/sinapse/**', '.github/workflows/sinapse.yml']

jobs:
  pglite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brobot/sinapse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verificar
      - run: npm test

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinapse
          POSTGRES_PASSWORD: sinapse
          POSTGRES_DB: sinapse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sinapse" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: brobot/sinapse
    env:
      TESTE_DATABASE_URL: postgres://sinapse:sinapse@localhost:5432/sinapse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verificar
      - run: npm test
