name: Estadia · testes

on:
  push:
    paths: ['brobot/estadia/**', '.github/workflows/estadia.yml']
  pull_request:
    paths: ['brobot/estadia/**', '.github/workflows/estadia.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brobot/estadia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
